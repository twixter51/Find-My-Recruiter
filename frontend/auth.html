<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in | Find My Rec</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="dist/auth.js" defer></script>
  </head>
  <body>
    <header class="site-header"><a class="brand" href="index.html">FIND MY REC</a></header>
    <main class="auth-page">
      <section id="locked-preview" hidden>
        <h1>Your search is ready.</h1>
        <p class="note">Sign up to find contacts for your job.</p>
        <div class="placeholder-list" aria-hidden="true"><div></div><div></div><div></div></div>
      </section>
      <section class="search-panel">
        <h2 id="auth-heading">Create your account</h2>
        <p>Start with 3 search credits.</p>
        <p id="credit-consent" class="note">After email confirmation and login, your pending search runs automatically and uses 1 credit. Each additional results page or refresh costs 1 credit.</p>
        <form id="auth-form">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" maxlength="254" required />
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required />
          <button id="auth-submit" type="submit">Sign up</button>
        </form>
        <p id="auth-message" role="status"></p>
        <button id="auth-switch" type="button" class="secondary-button">Already have an account? Log in</button>
      </section>
    </main>
  </body>
</html>
